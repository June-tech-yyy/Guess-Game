<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>同频 · Same Frequency</title>
<style>
  :root{
    --bg:#0a0f16; --panel:#111b26; --line:#1e2f40; --txt:#e8eef5; --dim:#7f95a8;
    --acc:#5b8cff; --ok:#3ecf8e; --warm:#f5b544; --bad:#e5484d; --cold:#2a3a4a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:radial-gradient(800px 460px at 50% -8%, #16283c, var(--bg));
    color:var(--txt); font-family:ui-sans-serif,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:16px}
  .wrap{width:100%; max-width:420px; position:relative}
  header{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px}
  .brand{font-weight:800; font-size:19px; letter-spacing:.5px}
  .brand small{color:var(--dim); font-weight:600; font-size:11px; margin-left:5px}
  .streak{font-size:12px; color:var(--dim)}
  .streak b{color:var(--warm); font-size:15px}
  .streak{margin-left:auto}
  .ghost{background:transparent; border:1px solid var(--line); color:var(--dim); font:inherit;
    font-size:12px; padding:5px 10px; border-radius:8px; cursor:pointer; white-space:nowrap}
  .ghost:active{background:var(--panel); color:var(--txt)}

  .prompt{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px}
  .prompt .q{font-size:11.5px; color:var(--dim); letter-spacing:.5px; margin-bottom:6px}
  .prompt .t{font-size:19px; font-weight:800; line-height:1.35}
  .prompt .meta{font-size:11px; color:var(--dim); margin-top:8px}

  .rows{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
  .row{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:11px; padding:9px 11px; animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(6px); opacity:0} to{transform:none; opacity:1}}
  .row .w{font-size:16px; font-weight:800; flex:1}
  .row .tags{font-size:10.5px; color:var(--dim); margin-top:2px}
  .row .mk{min-width:26px; height:26px; padding:0 8px; border-radius:7px; display:flex; align-items:center;
    justify-content:center; font-size:11.5px; font-weight:800; flex:none; white-space:nowrap}
  .mk.g{background:var(--ok); color:#04241a}
  .mk.y{background:var(--warm); color:#26180a}
  .mk.b{background:var(--cold); color:#8aa0b4}
  .mk.k{background:#2f6fb5; color:#eaf3ff}
  .row.answered{border-color:#2c4155}

  .inputRow{display:flex; gap:8px; margin-bottom:10px}
  .inputRow input{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:12px 14px; color:var(--txt); font-size:15.5px; outline:none; font-family:inherit}
  .inputRow input:focus{border-color:var(--acc)}
  .inputRow button{padding:0 20px; border-radius:11px; border:none; background:var(--acc); color:#fff;
    font-size:15px; font-weight:800; cursor:pointer}
  .inputRow button:disabled{opacity:.4; cursor:default}

  .hint{font-size:11.5px; color:var(--dim); text-align:center; margin-bottom:14px; min-height:16px}
  .hint b{color:var(--warm)}

  .result{display:none; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .result.show{display:block; animation:pop .2s ease-out}
  .result h2{margin:0 0 8px; font-size:16px}
  .result .big{font-size:22px; font-weight:800; margin-bottom:10px}
  .result .big.win{color:var(--ok)} .result .big.lose{color:var(--bad)}
  .result p{margin:0 0 10px; font-size:12.5px; color:var(--dim); line-height:1.6}
  .btns{display:flex; gap:8px}
  .btns button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:#17283a;
    color:var(--txt); font-size:12.5px; font-weight:700; cursor:pointer}
  .btns button.primary{background:var(--acc); border-color:var(--acc)}

  .foot{font-size:10.5px; color:#4e657a; text-align:center; line-height:1.7}
  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,10px); background:#e8eef5; color:#0a0f16;
    padding:9px 16px; border-radius:20px; font-size:12.5px; font-weight:700; opacity:0; pointer-events:none; transition:.2s}
  .toast.show{opacity:1; transform:translate(-50%,0)}

  /* 惩罚小游戏 */
  .overlay{position:fixed; inset:0; background:rgba(6,10,16,.96); display:none; align-items:center;
    justify-content:center; padding:18px; z-index:50}
  .overlay.show{display:flex}
  .ov-card{width:100%; max-width:380px; background:#0e1721; border:1px solid var(--line); border-radius:16px;
    padding:18px; text-align:center}
  .ov-kicker{font-size:10.5px; letter-spacing:2px; color:var(--dim); margin-bottom:6px}
  .ov-card h3{font-size:19px; margin:0 0 6px}
  #stage{min-height:120px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; width:100%}
  .ov-card p{font-size:12.5px; color:var(--dim); margin:0 0 14px; line-height:1.6; min-height:34px}
  .timerBar{width:100%; height:5px; background:#1e2f40; border-radius:3px; margin-top:14px; overflow:hidden}
  .timerBar i{display:block; height:100%; width:100%; background:var(--acc); transition:width .1s linear}

  .pgBig{width:150px; height:150px; border-radius:50%; border:3px solid var(--acc); background:#16283c;
    color:var(--txt); font-size:22px; font-weight:800; cursor:pointer; transition:transform .06s; user-select:none; touch-action:none}
  .pgBig:active{transform:scale(.94)}
  .pgNum{margin-top:12px; font-size:13px; color:var(--dim)}
  .pgNum b{color:var(--txt); font-size:20px}
  .pgProg{width:100%; height:7px; background:#1e2f40; border-radius:4px; margin-top:14px; overflow:hidden}
  .pgProg i{display:block; height:100%; width:0; background:var(--ok); transition:width .1s linear}
  .pgRange{width:100%; accent-color:var(--acc); margin:18px 0 6px}
  .pgDrag{position:relative; width:100%; height:190px; background:#101c27; border:1px solid var(--line);
    border-radius:12px; touch-action:none; overflow:hidden}
  .pgTarget{position:absolute; right:18px; bottom:18px; width:78px; height:78px; border:2px dashed #4a6b8a;
    border-radius:50%; pointer-events:none}
  .pgDot{position:absolute; left:18px; top:18px; width:28px; height:28px; border-radius:50%;
    background:var(--acc); cursor:grab; touch-action:none; box-shadow:0 0 0 6px rgba(91,140,255,.18)}
  .pgPad{width:100%; height:190px; background:#101c27; border:1px solid var(--line); border-radius:12px;
    display:flex; align-items:center; justify-content:center; touch-action:none; position:relative; overflow:hidden}
  .pgHint{font-size:12px; color:var(--dim); pointer-events:none}
  .pgGrid{display:grid; gap:8px; margin:4px 0; width:100%}
  .pgCell{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:24px;
    background:#16283c; border:1px solid var(--line); border-radius:10px; cursor:pointer}
  .pgCell:active{transform:scale(.94)}
  .pgRow{display:flex; gap:8px; justify-content:center; margin-top:10px; flex-wrap:wrap; width:100%}
  .pgOpt{padding:12px 16px; border-radius:11px; border:1px solid var(--line); background:#16283c;
    color:var(--txt); font-size:15px; font-weight:700; cursor:pointer; min-width:74px}
  .pgOpt:active{transform:scale(.95)}
  .pgWord{font-size:26px; font-weight:800; letter-spacing:2px; margin:10px 0}
  .pgNote{font-size:11.5px; color:var(--warn); min-height:16px; margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">同频<small>Same Frequency</small></div>
    <div class="streak">连胜 <b id="streak">0</b> 天</div>
    <button class="ghost" id="practiceBtn">练手</button>
  </header>

  <div class="prompt">
    <div class="q" id="qLabel">今天的问题是</div>
    <div class="t" id="qText">—</div>
    <div class="meta" id="qMeta"></div>
  </div>

  <div class="rows" id="rows"></div>

  <div class="inputRow">
    <input id="guess" placeholder="随便说个词…" autocomplete="off" maxlength="20" enterkeyhint="go">
    <button id="send">说</button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="result" id="result"></div>

  <p class="foot">你和「对方」各说一个词。你猜中它想的那个词 = 同频。<br>猜错要先完成一个惩罚，才有下一次机会。<br>随便说，它没听懂的词不算次数。</p>
</div>

<div class="overlay" id="overlay">
  <div class="ov-card">
    <div class="ov-kicker" id="ovKicker">惩罚</div>
    <h3 id="ovName">—</h3>
    <p id="ovDesc">—</p>
    <div id="stage"></div>
    <div class="timerBar"><i id="bar"></i></div>
    <div class="pgNote" id="ovNote"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 可选：用 tools/build-extra.js 生成的扩展词库（联网抓来的同类词） -->
<script src="extra-words.js" onerror="void 0"></script>

function pickPrompt(seedStr){
  // 练习种子形如 2026-11-19-p3：从今天的题材往后轮，每次换一个
  const pm = /^(\d{4}-\d{2}-\d{2})-p(\d+)$/.exec(String(seedStr));
  const base = dayIndex(pm ? pm[1] : seedStr) + (pm ? Number(pm[2]) : 0);
  const i = ((base % PROMPTS.length) + PROMPTS.length) % PROMPTS.length;
  return PROMPTS[i];
}
function pickAnswer(prompt, seedStr){
  const rnd=mulberry32(hashStr("sf-answer-"+seedStr));
  return prompt.words[Math.floor(rnd()*prompt.words.length)];
}
/* 一次出题 = 题目 + 隐藏答案 + 日期种子 */
function makeRound(seedStr){
  const prompt=pickPrompt(seedStr);
  const answer=pickAnswer(prompt, seedStr+"-"+prompt.id);
  return {prompt, answer, seed:seedStr};
}

/* ---------------- 判定 ----------------
   同频 = 完全一样（含别称）
   在它的候选里 = 比标签重合度，给冷热
   不在候选但在这一类的词库里 = 同类（它听懂了，只是想的不是这个）
   在别的题目的词库里 = 类型不对
   三层之外 = 没听懂，不计次
   ---------------------------------------------------------------- */
function judge(guessRaw, answer, prompt){
  const g=ALIAS[norm(guessRaw)] || norm(guessRaw);
  if(g===norm(answer.w)) return {type:"exact", shared:answer.tags.slice(), guess:g};

  const entry=prompt.words.find(x=>norm(x.w)===g);
  if(entry){
    const hit=entry.tags.filter(t=>answer.tags.includes(t));
    return {type: hit.length>=2?"warm":hit.length===1?"near":"cold", shared:hit, guess:g};
  }
  if(prompt.family.some(w=>norm(w)===g)) return {type:"kin", shared:[], guess:g};
  const inOther=PROMPTS.some(p=>p!==prompt &&
    (p.family.some(w=>norm(w)===g) || p.words.some(x=>norm(x.w)===g)));
  if(inOther) return {type:"wrong", shared:[], guess:g};
  return {type:"unknown", shared:[], guess:g};
}

/* ---------------- 界面 ---------------- */
let round=null, tries=[], done=false, won=false, practice=false, timerId=0;

function renderHead(){
  const d=state.days[todayUTC()];
  $("#streak").textContent=(d&&d.streak)||0;
}
function renderRows(){
  const kind=round?round.prompt.kind:"";
  const map={ exact:["g","同频"], warm:["y","很接近"], near:["y","沾边"],
              cold:["b","不像"], kin:["k","同类，但不是它"], wrong:["b","不是这一类"] };
  $("#rows").innerHTML=tries.map(t=>{
    const [mk,label]=map[t.type]||["b","不像"];
    const shared=t.shared||[];   // 旧版本存档没有 shared 字段
    const sub = shared.length ? "共同："+shared.join(" · ")
              : t.type==="kin"    ? `确实是${kind}，但它想的不是这个`
              : t.type==="wrong"  ? `这不是${kind}`
              : "维度全不同";
    return `<div class="row answered">
      <div style="flex:1"><div class="w">${t.guess||"—"}</div>
        <div class="tags">${sub}</div></div>
      <div class="mk ${mk}">${label}</div></div>`;
  }).join("");
}
function renderHint(){
  const left=MAX_TRIES-tries.length;
  if(done) { $("#hint").textContent=""; return; }
  $("#hint").innerHTML = left>0
    ? `还剩 <b>${left}</b> 次机会 · 它想的是最常见的说法`
    : "";
}

/* ---------------- 主流程 ---------------- */
function newRound(seed, isPractice){
  practice=!!isPractice;
  round=makeRound(seed);
  tries=[]; done=false; won=false;
  $("#qText").textContent=round.prompt.q;
  $("#qLabel").textContent=(isPractice?"练习题目":"今天的问题是")+" · "+round.prompt.label;
  $("#qMeta").textContent=isPractice?"练习模式不记连胜":"每天一题 · 全球同一个答案 · 题材每天轮换";
  $("#guess").value=""; $("#guess").disabled=false; $("#send").disabled=false;
  $("#result").classList.remove("show"); $("#result").innerHTML="";
  renderRows(); renderHint(); renderHead();
  setTimeout(()=>$("#guess").focus(), 60);
}

function submitGuess(){
  if(done) return;
  const raw=$("#guess").value;
  if(!norm(raw)) return;
  const r=judge(raw, round.answer, round.prompt);
  // 它没听懂：不计次、不惩罚，让玩家改个说法
  if(r.type==="unknown"){
    toast(`它没听懂「${r.guess}」· 这次不算，换个名词说法再试`);
    try{ $("#guess").select(); }catch(e){}
    return;
  }
  // 同一个词不重复计入
  if(tries.some(t=>t.guess===r.guess)){ toast("这个词说过了"); return; }
  tries.push(r);
  $("#guess").value="";
  renderRows();

  if(r.type==="exact"){ finish(true); return; }
  if(tries.length>=MAX_TRIES){ finish(false); return; }
  // 不同频 → 先跑完一个惩罚
  startPunishment();
}

function finish(win){
  done=true; won=win;
  $("#guess").disabled=true; $("#send").disabled=true;
  const used=tries.length;
  const score = win ? Math.max(40, 100-(used-1)*20) : 0;
  const day=todayUTC();
  const d=state.days[day]||(state.days[day]={});
  if(!practice){
    if(win){
      const prev=d.date;
      const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
      d.streak = prev===y ? (d.streak||0)+1 : (prev===day ? (d.streak||1) : 1);
      d.date=day; d.win=true; d.tries=used;
    } else {
      d.date=day; d.win=false; d.tries=used; d.streak=0;
    }
    d.score=score;
    d.guesses=tries.map(t=>({guess:t.guess, type:t.type, shared:t.shared}));
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  renderResult(win, score);
  renderHint(); renderHead();
}

function renderResult(win, score){
  const used=tries.length;
  const day=todayUTC();
  const el=$("#result");
  el.innerHTML=`
    <h2>${win?"🟩 同频了":"⬛ 没对上"}</h2>
    <div class="big ${win?"win":"lose"}">${win?score:0} 分 · 连胜 ${(state.days[day]&&state.days[day].streak)||0} 天</div>
    <p>对方想的是 <b style="color:var(--txt)">${round.answer.w}</b>
      （${round.answer.tags.join(" · ")}）${win?"，你在第 "+used+" 次说中了。":"你说了 "+tries.map(t=>t.guess).join("、")+"。"}</p>
    <div class="btns">
      <button class="primary" id="shareBtn">复制结果</button>
      <button id="againBtn">换一题练手</button>
    </div>`;
  el.classList.add("show");
  $("#shareBtn").addEventListener("click", share);
  $("#againBtn").addEventListener("click", startPractice);
}

/* 当天已玩过：复原结果，不允许当天重玩 */
function restore(d){
  done=true; won=!!d.win;
  tries=(d.guesses||[]).slice();
  $("#guess").disabled=true; $("#send").disabled=true;
  renderRows();
  renderResult(won, d.score||0);
  renderHint(); renderHead();
}

function share(){
  const grid=tries.map(t=>t.type==="exact"?"🟩":(t.type==="warm"||t.type==="near")?"🟨":t.type==="kin"?"🟦":"⬛").join("");
  const d=state.days[todayUTC()]||{};
  const text=`同频 ${todayUTC()} 「${round.prompt.q}」\n${grid} ${won?tries.length+"次说中":"没对上"}\n连胜 ${d.streak||0} 天\n${location.href}`;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("已复制")).catch(()=>toast("复制失败"));
  } else {
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove(); toast("已复制");
  }
}

/* =====================================================================
   惩罚引擎：15 种
   tier 1/2/3 对应第 1/2/3 次猜错；同日同次失误，所有人抽到同一种
   ===================================================================== */
function mix(arr, rnd){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

      stage.innerHTML=`<div class="pgNote" style="font-size:13px;color:#c9d6e4;margin-bottom:12px">「${line}」</div>
        <button class="pgBig" style="width:112px;height:112px;font-size:16px">按住</button><div class="pgProg"><i></i></div>`;
      const b=stage.querySelector(".pgBig"), bar=stage.querySelector(".pgProg i");
      let t=0, iv=null;
      b.addEventListener("pointerdown", e=>{ e.preventDefault(); if(iv) return;
        iv=setInterval(()=>{ t+=100; bar.style.width=(t/5000*100)+"%";
          if(t>=5000){ clearInterval(iv); iv=null; api.pass(); } },100); });
      b.addEventListener("pointerup", ()=>{ if(iv&&t<5000){ clearInterval(iv); iv=null; t=0; bar.style.width="0%"; } });
      b.addEventListener("pointercancel", ()=>{ if(iv&&t<5000){ clearInterval(iv); iv=null; t=0; bar.style.width="0%"; } });
    } },
];

let P={on:false, done:false, timers:[], why:""};
function later(fn,ms){ const id=setTimeout(fn,ms); P.timers.push(["t",id]); return id; }
function every(fn,ms){ const id=setInterval(fn,ms); P.timers.push(["i",id]); return id; }
function clearAll(){
  P.timers.forEach(t=> t[0]==="t" ? clearTimeout(t[1]) : clearInterval(t[1]));
  P.timers=[];
}

function pickPunish(dateStr, promptId, attempt){
  const rnd=mulberry32(hashStr("punish-"+dateStr+"|"+promptId+"|"+attempt));
  const bucket=PUNISH.filter(p=>p.tier===attempt);
  return bucket[Math.floor(rnd()*bucket.length)];
}

function startPunishment(){
  clearAll(); P.on=true; P.done=false; P.why="";
  try{ $("#guess").blur(); }catch(e){}
  const attempt=Math.min(tries.length,3);
  const rnd=mulberry32(hashStr("punish-"+todayUTC()+"|"+round.prompt.id+"|"+attempt));
  const p=pickPunish(todayUTC(), round.prompt.id, attempt);

  $("#ovKicker").textContent=`第 ${attempt} 次跑 · TIER ${attempt}`;
  $("#ovName").textContent="命运抽签…";
  $("#ovDesc").textContent="看看这次抽到什么。";
  $("#stage").innerHTML="";
  $("#ovNote").textContent="";
  $("#bar").style.width="100%";
  $("#overlay").classList.add("show");

  let k=0;
  const spin=every(()=>{
    $("#ovName").textContent=PUNISH[Math.floor(rnd()*PUNISH.length)].name;
    if(++k>7){ clearInterval(spin); beginPunish(p); }
  }, 95);
}

function beginPunish(p){
  $("#ovName").textContent=p.name;
  $("#ovDesc").textContent=p.desc;
  const stage=$("#stage"); stage.innerHTML="";
  const api={
    pass(){ if(!P.on||P.done) return; P.done=true; endPunish(true); },
    fail(why){ if(!P.on||P.done) return; P.done=true; P.why=why||""; endPunish(false); },
    note(t){ $("#ovNote").textContent=t; }
  };
  try{
    p.build(stage, api, mulberry32(hashStr("px-"+todayUTC()+"-"+p.id)));
  }catch(e){ api.fail("这个惩罚出了点问题"); return; }

  if(p.sec>0){
    const t0=Date.now();
    every(()=>{
      const left=Math.max(0, p.sec*1000-(Date.now()-t0));
      $("#bar").style.width=(left/(p.sec*1000)*100)+"%";
      if(left<=0) api.fail("超时");
    }, 80);
  }
}

function endPunish(pass){
  P.on=false;
  clearAll();
  $("#overlay").classList.remove("show");
  if(pass){
    toast(["跑完了，可以再猜","过了，说吧","行，你跑完了"][Math.floor(Math.random()*3)]);
    $("#guess").focus();
  } else {
    toast((P.why ? P.why+"，" : "") + "今天到此为止");
    finish(false);
  }
}

/* ---------------- 练习模式 ---------------- */
function startPractice(){
  state.practice=(state.practice||0)+1;
  newRound(todayUTC()+"-p"+state.practice, true);
  $("#practiceBtn").textContent="回到今日";
}
function goToday(){
  const day=todayUTC();
  newRound(day, false);
  const d=state.days[day];
  if(d && d.date===day && Array.isArray(d.guesses) && d.guesses.length) restore(d);
  $("#practiceBtn").textContent="练手";
}

/* ---------------- 事件 ---------------- */
$("#practiceBtn").addEventListener("click", ()=>{ practice ? goToday() : startPractice(); });
$("#send").addEventListener("click", submitGuess);
$("#guess").addEventListener("keydown", e=>{ if(e.key==="Enter") submitGuess(); });

let toastId=0;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastId); toastId=setTimeout(()=>t.classList.remove("show"),1500);
}

/* ---------------- 启动 ---------------- */
(function boot(){
  const day=todayUTC();
  const d=state.days[day];
  newRound(day, false);
  if(d && d.date===day && Array.isArray(d.guesses) && d.guesses.length){
    restore(d);
    toast(d.win?"今天已经同频过了，明天再来":"今天已经结束了，明天再来");
  }
})();
</script>
